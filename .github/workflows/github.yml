name: Gerar cards de estatísticas (radiais)
 
on:
  schedule:
    # Executa uma vez por dia, à meia-noite UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # permite rodar manualmente pela aba Actions
 
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
 
      - name: Gerar cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.README_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          THEME: github_dark
 
